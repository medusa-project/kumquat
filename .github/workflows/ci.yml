name: CI
on: [push, pull_request]
jobs:
  build:
    name: Test in Docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::721945215539:role/github-actions-medusa-client
          role-session-name: GithubActionsKumquatSession
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Checkout the repository
        uses: actions/checkout@v2
      - name: Pull images (retry)
        run: |
          set -euo pipefail
          pulled=false
          for i in 1 2 3; do
            echo "Pull attempt $i..."
            if docker compose pull; then 
              pulled=true
              break
            fi
            if [ "$i" -lt 3 ]; then
              sleep $((i * 20))
            fi
          done
          if [ "$pulled" != "true" ]; then
            echo "docker compose pull failed after 3 attempts."
            exit 1
          fi

      - name: Run integration stack
        run: docker compose up --build --exit-code-from kumquat
